<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="wfCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Node 1 Border & Accents (Sky Blue) -->
    <linearGradient id="wfBorder1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Node 2 Border & Accents (Indigo) -->
    <linearGradient id="wfBorder2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Node 3 Border & Accents (Rose / Pink) -->
    <linearGradient id="wfBorder3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Node 4 Border & Accents (Emerald) -->
    <linearGradient id="wfBorder4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Flow Line Gradients -->
    <linearGradient id="flowGrad12" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="flowGrad23" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="flowGrad34" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Filter for glowing pulses -->
    <filter id="wfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .flow-pulse {
        stroke-dasharray: 8 10;
        animation: animFlow 1.6s linear infinite;
      }
      .card-glow-1 {
        animation: glowCard 3.5s ease-in-out infinite;
      }
      .card-glow-2 {
        animation: glowCard 3.5s ease-in-out 0.8s infinite;
      }
      .card-glow-3 {
        animation: glowCard 3.5s ease-in-out 1.6s infinite;
      }
      .card-glow-4 {
        animation: glowCard 3.5s ease-in-out 2.4s infinite;
      }
      .badge-blink {
        animation: blinkDot 2s ease-in-out infinite;
      }

      @keyframes animFlow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -36; }
      }
      @keyframes glowCard {
        0%, 100% { stroke-opacity: 0.65; }
        50% { stroke-opacity: 1; }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Canvas Container Base -->
  <rect width="1000" height="390" rx="16" fill="#080d1a" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header Block -->
  <g transform="translate(32, 28)">
    <rect width="210" height="20" rx="4" fill="#0369a1" fill-opacity="0.2" stroke="#0284c7" stroke-width="0.8" />
    <circle class="badge-blink" cx="12" cy="10" r="3.5" fill="#38bdf8" />
    <text x="24" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8" letter-spacing="1">
      NBA / NAAC ACCREDITATION PIPELINE
    </text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">
      Continuous Outcome-Based Education (OBE) Dataflow
    </text>
    <text x="500" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
      End-to-End: Curriculum Modeling ➔ Mark Ingestion ➔ Calculation ➔ Accreditation Dossiers
    </text>
  </g>

  <!-- ==================== CONNECTING ANIMATED DATA PIPES ==================== -->
  <!-- Pipe 1: Stage 1 to Stage 2 (x=247 to x=275, center at y=225) -->
  <line x1="247" y1="225" x2="275" y2="225" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <line class="flow-pulse" x1="247" y1="225" x2="275" y2="225" stroke="url(#flowGrad12)" stroke-width="4" stroke-linecap="round" filter="url(#wfGlow)" />
  <polygon points="274,220 280,225 274,230" fill="#818cf8" />

  <!-- Pipe 2: Stage 2 to Stage 3 (x=490 to x=520, center at y=225) -->
  <line x1="490" y1="225" x2="520" y2="225" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <line class="flow-pulse" x1="490" y1="225" x2="520" y2="225" stroke="url(#flowGrad23)" stroke-width="4" stroke-linecap="round" filter="url(#wfGlow)" />
  <polygon points="519,220 525,225 519,230" fill="#fb7185" />

  <!-- Pipe 3: Stage 3 to Stage 4 (x=735 to x=765, center at y=225) -->
  <line x1="735" y1="225" x2="765" y2="225" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <line class="flow-pulse" x1="735" y1="225" x2="765" y2="225" stroke="url(#flowGrad34)" stroke-width="4" stroke-linecap="round" filter="url(#wfGlow)" />
  <polygon points="764,220 770,225 764,230" fill="#34d399" />


  <!-- ==================== STAGE 01: CURRICULUM SETUP ==================== -->
  <g transform="translate(32, 90)">
    <!-- Card Frame -->
    <rect width="215" height="270" rx="12" fill="url(#wfCardBg)" stroke="#1e293b" stroke-width="1.2" />
    <rect class="card-glow-1" width="215" height="270" rx="12" fill="none" stroke="url(#wfBorder1)" stroke-width="1.8" />
    
    <!-- Top Accent Bar -->
    <rect x="0" y="0" width="215" height="4" rx="2" fill="#38bdf8" />

    <!-- Stage Tag -->
    <rect x="14" y="16" width="68" height="20" rx="10" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="0.8" />
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">
      STAGE 01
    </text>

    <!-- Card Title -->
    <text x="14" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">
      Curriculum Setup
    </text>
    <text x="14" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
      Outcome Definitions
    </text>

    <!-- Divider -->
    <line x1="14" y1="90" x2="201" y2="90" stroke="#1e293b" stroke-width="1" />

    <!-- Feature Bullets with Explicit Positioning -->
    <g transform="translate(14, 102)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
      <!-- Item 1 -->
      <circle cx="5" cy="11" r="3" fill="#38bdf8" />
      <text x="16" y="15" fill="#f1f5f9" font-weight="600">Academic Hierarchy</text>
      <text x="16" y="29" fill="#94a3b8" font-size="10">Depts, Batches, Terms</text>

      <!-- Item 2 -->
      <circle cx="5" cy="47" r="3" fill="#38bdf8" />
      <text x="16" y="51" fill="#f1f5f9" font-weight="600">PO1–PO12 &amp; PSO1–3</text>
      <text x="16" y="65" fill="#94a3b8" font-size="10">NBA Graduate Attributes</text>

      <!-- Item 3 -->
      <circle cx="5" cy="83" r="3" fill="#38bdf8" />
      <text x="16" y="87" fill="#f1f5f9" font-weight="600">Bloom's L1–L6 Levels</text>
      <text x="16" y="101" fill="#94a3b8" font-size="10">Action verbs &amp; taxonomy</text>

      <!-- Item 4 -->
      <circle cx="5" cy="119" r="3" fill="#38bdf8" />
      <text x="16" y="123" fill="#f1f5f9" font-weight="600">CO-PO Mapping Matrix</text>
      <text x="16" y="137" fill="#94a3b8" font-size="10">5×12 correlation scale (1–3)</text>
    </g>
  </g>


  <!-- ==================== STAGE 02: DATA INGESTION ==================== -->
  <g transform="translate(275, 90)">
    <!-- Card Frame -->
    <rect width="215" height="270" rx="12" fill="url(#wfCardBg)" stroke="#1e293b" stroke-width="1.2" />
    <rect class="card-glow-2" width="215" height="270" rx="12" fill="none" stroke="url(#wfBorder2)" stroke-width="1.8" />
    
    <!-- Top Accent Bar -->
    <rect x="0" y="0" width="215" height="4" rx="2" fill="#818cf8" />

    <!-- Stage Tag -->
    <rect x="14" y="16" width="68" height="20" rx="10" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="0.8" />
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#818cf8">
      STAGE 02
    </text>

    <!-- Card Title -->
    <text x="14" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">
      Data Ingestion
    </text>
    <text x="14" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
      Direct &amp; Indirect Streams
    </text>

    <!-- Divider -->
    <line x1="14" y1="90" x2="201" y2="90" stroke="#1e293b" stroke-width="1" />

    <!-- Feature Bullets with Explicit Positioning -->
    <g transform="translate(14, 102)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
      <!-- Item 1 -->
      <circle cx="5" cy="11" r="3" fill="#818cf8" />
      <text x="16" y="15" fill="#f1f5f9" font-weight="600">Internal Tests (CIE)</text>
      <text x="16" y="29" fill="#94a3b8" font-size="10">Unit tests UT1/2, Mid-Sem</text>

      <!-- Item 2 -->
      <circle cx="5" cy="47" r="3" fill="#818cf8" />
      <text x="16" y="51" fill="#f1f5f9" font-weight="600">End Semester (ESE)</text>
      <text x="16" y="65" fill="#94a3b8" font-size="10">University exam scores</text>

      <!-- Item 3 -->
      <circle cx="5" cy="83" r="3" fill="#818cf8" />
      <text x="16" y="87" fill="#f1f5f9" font-weight="600">CCA &amp; ECA Activities</text>
      <text x="16" y="101" fill="#94a3b8" font-size="10">Workshops, NSS, Sports</text>

      <!-- Item 4 -->
      <circle cx="5" cy="119" r="3" fill="#818cf8" />
      <text x="16" y="123" fill="#f1f5f9" font-weight="600">Stakeholder Surveys</text>
      <text x="16" y="137" fill="#94a3b8" font-size="10">Alumni, Employer, Exit</text>
    </g>
  </g>


  <!-- ==================== STAGE 03: OBE FORMULA ENGINE ==================== -->
  <g transform="translate(520, 90)">
    <!-- Card Frame -->
    <rect width="215" height="270" rx="12" fill="url(#wfCardBg)" stroke="#1e293b" stroke-width="1.2" />
    <rect class="card-glow-3" width="215" height="270" rx="12" fill="none" stroke="url(#wfBorder3)" stroke-width="1.8" />
    
    <!-- Top Accent Bar -->
    <rect x="0" y="0" width="215" height="4" rx="2" fill="#fb7185" />

    <!-- Stage Tag -->
    <rect x="14" y="16" width="68" height="20" rx="10" fill="#9f1239" fill-opacity="0.3" stroke="#fb7185" stroke-width="0.8" />
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fb7185">
      STAGE 03
    </text>

    <!-- Card Title -->
    <text x="14" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">
      OBE Calculation
    </text>
    <text x="14" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
      Dynamic Formula Engine
    </text>

    <!-- Divider -->
    <line x1="14" y1="90" x2="201" y2="90" stroke="#1e293b" stroke-width="1" />

    <!-- Feature Bullets with Explicit Positioning -->
    <g transform="translate(14, 102)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
      <!-- Item 1 -->
      <circle cx="5" cy="11" r="3" fill="#fb7185" />
      <text x="16" y="15" fill="#f1f5f9" font-weight="600">Threshold Benchmarks</text>
      <text x="16" y="29" fill="#94a3b8" font-size="10">Levels 0 to 3 scale (0–3.0)</text>

      <!-- Item 2 -->
      <circle cx="5" cy="47" r="3" fill="#fb7185" />
      <text x="16" y="51" fill="#f1f5f9" font-weight="600">Direct Attainment (80%)</text>
      <text x="16" y="65" fill="#94a3b8" font-size="10">Weighted CO-PO mapping</text>

      <!-- Item 3 -->
      <circle cx="5" cy="83" r="3" fill="#fb7185" />
      <text x="16" y="87" fill="#f1f5f9" font-weight="600">Indirect Attainment (20%)</text>
      <text x="16" y="101" fill="#94a3b8" font-size="10">Normalized surveys &amp; CCA</text>

      <!-- Item 4 -->
      <circle cx="5" cy="119" r="3" fill="#fb7185" />
      <text x="16" y="123" fill="#f1f5f9" font-weight="600">Final PO &amp; PSO Result</text>
      <text x="16" y="137" fill="#94a3b8" font-size="10">80:20 combined formula</text>
    </g>
  </g>


  <!-- ==================== STAGE 04: AUDIT & SAR REPORTS ==================== -->
  <g transform="translate(765, 90)">
    <!-- Card Frame -->
    <rect width="203" height="270" rx="12" fill="url(#wfCardBg)" stroke="#1e293b" stroke-width="1.2" />
    <rect class="card-glow-4" width="203" height="270" rx="12" fill="none" stroke="url(#wfBorder4)" stroke-width="1.8" />
    
    <!-- Top Accent Bar -->
    <rect x="0" y="0" width="203" height="4" rx="2" fill="#34d399" />

    <!-- Stage Tag -->
    <rect x="14" y="16" width="68" height="20" rx="10" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="0.8" />
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399">
      STAGE 04
    </text>

    <!-- Card Title -->
    <text x="14" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">
      Audit &amp; Reports
    </text>
    <text x="14" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
      NBA Compliance Ready
    </text>

    <!-- Divider -->
    <line x1="14" y1="90" x2="189" y2="90" stroke="#1e293b" stroke-width="1" />

    <!-- Feature Bullets with Explicit Positioning -->
    <g transform="translate(14, 102)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
      <!-- Item 1 -->
      <circle cx="5" cy="11" r="3" fill="#34d399" />
      <text x="16" y="15" fill="#f1f5f9" font-weight="600">Recharts Dashboards</text>
      <text x="16" y="29" fill="#94a3b8" font-size="10">Radar &amp; gap charts</text>

      <!-- Item 2 -->
      <circle cx="5" cy="47" r="3" fill="#34d399" />
      <text x="16" y="51" fill="#f1f5f9" font-weight="600">Puppeteer PDF Dossier</text>
      <text x="16" y="65" fill="#94a3b8" font-size="10">Official signed reports</text>

      <!-- Item 3 -->
      <circle cx="5" cy="83" r="3" fill="#34d399" />
      <text x="16" y="87" fill="#f1f5f9" font-weight="600">ExcelJS Multi-Sheet</text>
      <text x="16" y="101" fill="#94a3b8" font-size="10">Auditor formatted .xlsx</text>

      <!-- Item 4 -->
      <circle cx="5" cy="119" r="3" fill="#34d399" />
      <text x="16" y="123" fill="#f1f5f9" font-weight="600">SAR Criteria 3 File</text>
      <text x="16" y="137" fill="#94a3b8" font-size="10">Complete compliance pack</text>
    </g>
  </g>
</svg>
