<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="l6Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>
    <linearGradient id="l5Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="l4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="l3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="l2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="l1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <style>
      .tier-pulse {
        animation: glowTier 3s ease-in-out infinite;
      }
      .tier-pulse:nth-child(2) { animation-delay: 0.5s; }
      .tier-pulse:nth-child(3) { animation-delay: 1.0s; }
      .tier-pulse:nth-child(4) { animation-delay: 1.5s; }
      .tier-pulse:nth-child(5) { animation-delay: 2.0s; }
      .tier-pulse:nth-child(6) { animation-delay: 2.5s; }

      @keyframes glowTier {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.4)); }
      }
    </style>
  </defs>

  <rect width="1000" height="280" rx="14" fill="#080c16" stroke="#1e293b" stroke-width="1.2" />

  <!-- Title -->
  <g transform="translate(32, 24)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
      BLOOM'S REVISED TAXONOMY ENGINE
    </text>
    <text y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
      Cognitive Domain Hierarchy Integrated in Question Bank &amp; Course Outcomes
    </text>
  </g>

  <!-- 6 Horizontal Bloom's Hierarchy Tiers -->
  <g transform="translate(32, 68)">
    <!-- L6: CREATE -->
    <g class="tier-pulse" transform="translate(0, 0)">
      <rect width="936" height="28" rx="6" fill="#1e1b4b" fill-opacity="0.4" stroke="#ef4444" stroke-width="0.8" />
      <rect x="0" y="0" width="130" height="28" rx="6" fill="url(#l6Grad)" />
      <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff">
        L6 • CREATE
      </text>
      <text x="145" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f87171">
        Design, Construct, Formulate, Invent, Synthesize
      </text>
      <text x="800" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">
        HOTS • High Cognitive
      </text>
    </g>

    <!-- L5: EVALUATE -->
    <g class="tier-pulse" transform="translate(0, 34)">
      <rect width="936" height="28" rx="6" fill="#1e1b4b" fill-opacity="0.4" stroke="#f97316" stroke-width="0.8" />
      <rect x="0" y="0" width="130" height="28" rx="6" fill="url(#l5Grad)" />
      <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff">
        L5 • EVALUATE
      </text>
      <text x="145" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fb923c">
        Appraise, Critique, Defend, Judge, Justify, Validate
      </text>
      <text x="800" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">
        HOTS • Critical Assessment
      </text>
    </g>

    <!-- L4: ANALYZE -->
    <g class="tier-pulse" transform="translate(0, 68)">
      <rect width="936" height="28" rx="6" fill="#1e1b4b" fill-opacity="0.4" stroke="#eab308" stroke-width="0.8" />
      <rect x="0" y="0" width="130" height="28" rx="6" fill="url(#l4Grad)" />
      <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#1e293b">
        L4 • ANALYZE
      </text>
      <text x="145" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#facc15">
        Compare, Deconstruct, Differentiate, Distinguish, Examine
      </text>
      <text x="800" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">
        MOTS • Analytical Depth
      </text>
    </g>

    <!-- L3: APPLY -->
    <g class="tier-pulse" transform="translate(0, 102)">
      <rect width="936" height="28" rx="6" fill="#1e1b4b" fill-opacity="0.4" stroke="#10b981" stroke-width="0.8" />
      <rect x="0" y="0" width="130" height="28" rx="6" fill="url(#l3Grad)" />
      <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#042f2e">
        L3 • APPLY
      </text>
      <text x="145" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">
        Calculate, Demonstrate, Execute, Implement, Solve
      </text>
      <text x="800" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">
        MOTS • Practical Execution
      </text>
    </g>

    <!-- L2: UNDERSTAND -->
    <g class="tier-pulse" transform="translate(0, 136)">
      <rect width="936" height="28" rx="6" fill="#1e1b4b" fill-opacity="0.4" stroke="#06b6d4" stroke-width="0.8" />
      <rect x="0" y="0" width="130" height="28" rx="6" fill="url(#l2Grad)" />
      <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#083344">
        L2 • UNDERSTAND
      </text>
      <text x="145" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">
        Classify, Describe, Discuss, Explain, Identify, Summarize
      </text>
      <text x="800" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">
        LOTS • Comprehension
      </text>
    </g>

    <!-- L1: REMEMBER -->
    <g class="tier-pulse" transform="translate(0, 170)">
      <rect width="936" height="28" rx="6" fill="#1e1b4b" fill-opacity="0.4" stroke="#6366f1" stroke-width="0.8" />
      <rect x="0" y="0" width="130" height="28" rx="6" fill="url(#l1Grad)" />
      <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff">
        L1 • REMEMBER
      </text>
      <text x="145" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#818cf8">
        Define, Duplicate, List, Memorize, Recall, Repeat, State
      </text>
      <text x="800" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">
        LOTS • Foundational Knowledge
      </text>
    </g>
  </g>
</svg>
